# package:test configuration
# https://github.com/dart-lang/test/blob/master/pkgs/test/doc/configuration.md

timeout: 1m
concurrency: 8
platforms: [vm, node]

tags:
  vm-only:
    skip: true
    on_platform:
      vm:
        skip: false
  # Tests that only run on the stable Dart SDK.
  # CI excludes this tag with `-x stable-only` on Dart 2.19.
  stable-only: {}
