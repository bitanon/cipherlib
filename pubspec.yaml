name: cipherlib
description: Pure-Dart symmetric ciphers (AES modes, ChaCha20, XChaCha20,
  Salsa20, XSalsa20), their Poly1305 AEAD variants, and ML-KEM post-quantum
  key encapsulation (FIPS 203).
repository: https://github.com/bitanon/cipherlib
version: 0.7.0

environment:
  sdk: ">=2.19.0 <4.0.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  hashlib: ^2.4.1

dev_dependencies:
  lints: any
  test: any
  cryptography: any
  pointycastle: any
  pqcrypto: any

funding:
  - https://paypal.me/bitan0n
